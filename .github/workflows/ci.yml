name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 最低支持的版本(engines >=20)和当前的 LTS
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    # 安装依赖偶尔会卡住:超时就失败重跑,不要一直占着
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      # 编译,并检查 npm 包里有该有的文件、没有不该有的(账号数据、配置、源码、测试)
      - run: npm run build
      - run: npm run check:pack
